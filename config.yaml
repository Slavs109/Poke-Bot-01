# The GitHub workflow runs every five minutes.
# Direct product pages are more reliable than broad search/category pages.
check_interval_minutes: 5
page_timeout_seconds: 25

watches:
  # Pokémon Center still may block GitHub-hosted IPs. The code now warms the
  # homepage first, keeps cookies in one session, and retries temporary blocks.
  - name: "Pokémon Center 151 Elite Trainer Box"
    retailer: "Pokémon Center"
    url: "https://www.pokemoncenter.com/search/pokemon-151-trainer-box"
    warmup_url: "https://www.pokemoncenter.com/"
    max_price: 59.99
    enabled: true

  - name: "Pokémon Center TCG cards"
    retailer: "Pokémon Center"
    url: "https://www.pokemoncenter.com/category/tcg-cards?page=1"
    warmup_url: "https://www.pokemoncenter.com/"
    max_price: 64.99
    enabled: true

  # Target direct product pages
  - name: "Target Scarlet & Violet 151 Elite Trainer Box"
    url: "https://www.target.com/p/-/A-88897899"
    max_price: 59.99
    enabled: true

  - name: "Target Prismatic Evolutions Elite Trainer Box"
    url: "https://www.target.com/p/-/A-1010872626"
    max_price: 59.99
    enabled: true

  # Walmart direct product pages. The MSRP cap prevents inflated marketplace alerts.
  - name: "Walmart Scarlet & Violet 151 Elite Trainer Box"
    url: "https://www.walmart.com/ip/5337897826"
    max_price: 59.99
    enabled: true

  - name: "Walmart Prismatic Evolutions Pokémon Center Elite Trainer Box"
    url: "https://www.walmart.com/ip/15036972508"
    max_price: 64.99
    enabled: true

  # Best Buy direct product page
  - name: "Best Buy Prismatic Evolutions Super-Premium Collection"
    url: "https://www.bestbuy.com/product/sku/6621081"
    max_price: 99.99
    enabled: true

  # GameStop direct product pages
  - name: "GameStop Prismatic Evolutions Elite Trainer Box"
    url: "https://www.gamestop.com/toys-games/trading-cards/products/pokemon-trading-card-game-prismatic-evolutions-elite-trainer-box/417631.html"
    max_price: 59.99
    enabled: true

  - name: "GameStop Prismatic Evolutions Elite Trainer Box alternate listing"
    url: "https://www.gamestop.com/toys-games/trading-cards/products/pokemon-trading-card-game-prismatic-evolutions-elite-trainer-box/20018505.html"
    max_price: 59.99
    enabled: true

  # Additional retailer product/category pages. Keep these enabled for broader
  # coverage; replace them with exact product URLs whenever you find a listing.
  - name: "Costco Pokémon trading cards"
    url: "https://www.costco.com/pokemon.html"
    max_price: 99.99
    enabled: true

  - name: "Sam's Club Pokémon trading cards"
    url: "https://www.samsclub.com/s/pokemon%20cards"
    max_price: 99.99
    enabled: true

  - name: "Barnes & Noble Pokémon cards"
    url: "https://www.barnesandnoble.com/s/pokemon%20cards"
    max_price: 59.99
    enabled: true

  - name: "SCHEELS Pokémon cards"
    url: "https://www.scheels.com/search?q=pokemon%20cards"
    max_price: 59.99
    enabled: true
