# Direct-product monitoring only.
# The Discord report shows each store and includes exact product links for finds.
# Walmart is intentionally excluded from the GitHub-hosted scan because it
# consistently redirects shared GitHub IP addresses to a blocked page.
check_interval_minutes: 5
page_timeout_seconds: 25

watches:
