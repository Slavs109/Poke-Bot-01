  - name: "Target Pokémon 151 Elite Trainer Box"
    url: "https://www.target.com/p/-/A-88897899"
    checkout_url: "https://www.target.com/p/-/A-88897899"
    required_terms: ["pokemon", "151", "elite trainer box"]
    max_price: 59.99
    enabled: true

