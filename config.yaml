# Checks every five minutes. Retailers may temporarily block repeated automated visits.
check_interval_minutes: 5
page_timeout_seconds: 30

# You can enter the channel ID here or in the .env file.
discord_channel_id: 0

# Set searches currently enabled.
# The $59.99 ceiling is intended to catch normal ETBs and smaller sealed products,
# while rejecting most inflated marketplace listings. You can edit any ceiling.
