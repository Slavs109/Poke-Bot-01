# GitHub Actions runs this scan every five minutes.
# A page only qualifies when it includes required Pokémon wording plus a cart,
# bag, shipping, buy-now, or checkout signal.
check_interval_minutes: 5
page_timeout_seconds: 25

watches:
  - name: "Pokémon Center 151 products"
    retailer: "Pokémon Center"
    url: "https://www.pokemoncenter.com/search/pokemon-151"
    warmup_url: "https://www.pokemoncenter.com/"
    required_terms: ["pokemon", "151"]
    max_price: 64.99
    enabled: true

  - name: "Pokémon Center TCG cards"
    retailer: "Pokémon Center"
    url: "https://www.pokemoncenter.com/category/tcg-cards?page=1"
    warmup_url: "https://www.pokemoncenter.com/"
    required_terms: ["pokemon"]
    max_price: 64.99
    enabled: true

  - name: "Target Scarlet & Violet 151 Elite Trainer Box"
