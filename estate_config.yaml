estate_sales:
  enabled: true
  radius_miles: 25
  max_sales_per_search_page: 50
  request_delay_seconds: 0.5

  locations:
    - zip: "75043"
      city: "Garland"
      state: "TX"
    - zip: "75217"
      city: "Dallas"
      state: "TX"

  # Text alerts require one of these literal words/phrases in the sale page.
  keywords:
    - "pokemon"
    - "pokémon"
    - "pokemon cards"
    - "pokemon tcg"
    - "tcg"
    - "magic the gathering"
    - "mtg"
    - "yu-gi-oh"
    - "yugioh"
    - "one piece card game"
    - "lorcana"
    - "digimon card game"
    - "flesh and blood"
    - "dragon ball super card game"
    - "weiss schwarz"
    - "elite trainer box"
    - "etb"

  # Photo analysis is a second trigger for listings whose text has no keyword hit.
  # It is intentionally conservative and ignores sports cards and generic collectibles.
  photo_analysis:
    enabled: true
    model: "gpt-5-mini"
    minimum_confidence: 85
    max_photos_per_sale: 8
    photos_per_request: 4
    max_new_sales_scanned_per_run: 15
