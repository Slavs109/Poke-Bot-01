estate_sales:
  enabled: true
  radius_miles: 25
  max_sales_per_search_page: 50
  request_delay_seconds: 0.5

  locations:
    - zip: "75043"
      city: "Garland"
      state: "TX"
    - zip: "75217"
      city: "Dallas"
      state: "TX"

  # Text alerts require one of these literal words/phrases in the sale page.
  keywords:
    - "pokemon"
    - "pokémon"
    - "pokemon cards"
    - "pokemon tcg"
    - "tcg"
    - "magic the gathering"
    - "mtg"
    - "yu-gi-oh"
    - "yugioh"
    - "one piece card game"
    - "lorcana"
    - "digimon card game"
    - "flesh and blood"
    - "dragon ball super card game"
    - "weiss schwarz"
    - "elite trainer box"
    - "etb"

  # Local YOLO-World photo analysis. No API key is required.
  photo_analysis:
    enabled: true
    model: "yolov8s-world.pt"
    minimum_confidence: 0.35
    max_photos_per_sale: 8
    max_new_sales_scanned_per_run: 15
    classes:
      - "Pokemon trading card"
      - "Pokemon card binder page"
      - "Pokemon booster pack"
      - "Pokemon booster box"
      - "Pokemon Elite Trainer Box"
      - "Magic The Gathering card"
      - "Magic The Gathering booster pack"
      - "Yu-Gi-Oh trading card"
      - "Yu-Gi-Oh booster pack"
      - "One Piece Card Game card"
      - "Disney Lorcana card"
      - "Digimon trading card"
      - "Flesh and Blood trading card"
      - "Dragon Ball Super trading card"
      - "Weiss Schwarz trading card"
      - "graded Pokemon card slab"
      - "graded non-sports trading card slab"

# Extra public sources. These use exact keyword matching and avoid login-only scraping.
marketplace_sources:
  enabled: true
  sources:
    - name: "OfferUp"
      enabled: true
      max_items: 35
      delay_seconds: 0.4
      item_url_pattern: "offerup\\.com/item/detail/"
      search_urls:
        - "https://offerup.com/explore/sck/tx/dallas/pokemon"
        - "https://offerup.com/explore/sck/tx/garland/pokemon"
      exclude_phrases:
        - "sold"
        - "buying pokemon"
        - "cash for pokemon"
        - "looking to buy"

    - name: "Dallas Craigslist"
      enabled: true
      max_items: 40
      delay_seconds: 0.35
      item_url_pattern: "dallas\\.craigslist\\.org/.+\\.html"
      search_urls:
        - "https://dallas.craigslist.org/search/cba?purveyor=owner&query=pokemon"
        - "https://dallas.craigslist.org/search/taa?query=pokemon+cards"
      exclude_phrases:
        - "cash for pokemon"
        - "i am actively buying"
        - "looking to buy"
        - "want to buy"

    - name: "HiBid"
      enabled: true
      max_items: 40
      delay_seconds: 0.45
      item_url_pattern: "hibid\\.com/(?:texas/)?lot/|dallas\\.hibid\\.com/lot/"
      search_urls:
        - "https://hibid.com/texas/auctions/700074/antiques-and-collectibles/collectibles/trading-cards/pokemon-cards"
        - "https://dallas.hibid.com/auctions/700074/antiques-and-collectibles/collectibles/trading-cards/pokemon-cards"
      exclude_phrases: []

    - name: "ShopGoodwill"
      enabled: true
      max_items: 40
      delay_seconds: 0.45
      item_url_pattern: "shopgoodwill\\.com/item/\\d+"
      search_urls:
        - "https://shopgoodwill.com/categories/listing?st=pokemon%20cards&p=1&ps=40"
        - "https://shopgoodwill.com/categories/listing?st=pokemon%20tcg&p=1&ps=40"
      exclude_phrases: []
