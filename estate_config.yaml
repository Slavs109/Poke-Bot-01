estate_sales:
  enabled: true
  radius_miles: 25
  max_sales_per_search_page: 50
  request_delay_seconds: 0.5

  locations:
    - zip: "75043"
      city: "Garland"
      state: "TX"
    - zip: "75217"
      city: "Dallas"
      state: "TX"

  # Alert ONLY when one of these literal words/phrases appears in the sale title or page text.
  # Do not infer matches from related words such as "collectibles", "toys", or "memorabilia".
  keywords:
    - "pokemon"
    - "pokémon"
    - "pokemon cards"
    - "pokemon tcg"
    - "tcg"
    - "magic the gathering"
    - "mtg"
    - "yu-gi-oh"
    - "yugioh"
    - "one piece card game"
    - "lorcana"
    - "digimon card game"
    - "flesh and blood"
    - "dragon ball super card game"
    - "weiss schwarz"
    - "elite trainer box"
    - "etb"
