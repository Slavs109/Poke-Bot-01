estate_sales:
  enabled: true
  radius_miles: 25
  max_sales_per_search_page: 50
  request_delay_seconds: 0.5

  # Search both local ZIP areas.
  locations:
    - zip: "75043"
      city: "Garland"
      state: "TX"
    - zip: "75217"
      city: "Dallas"
      state: "TX"

  # Non-sports trading cards only.
  keywords:
    - "pokemon"
    - "pokémon"
    - "pokemon cards"
    - "pokemon tcg"
    - "trading cards"
    - "tcg"
    - "magic the gathering"
    - "mtg"
    - "yu-gi-oh"
    - "yugioh"
    - "one piece card game"
    - "lorcana"
    - "digimon card game"
    - "flesh and blood"
    - "dragon ball super card game"
    - "weiss schwarz"
    - "graded cards"
    - "card collection"
    - "card binder"
    - "booster pack"
    - "booster box"
    - "elite trainer box"
    - "etb"
    - "sealed tcg"
    - "psa"
    - "cgc"
    - "bgs"

  exclude_sports_terms:
    - "sports cards"
    - "baseball cards"
    - "basketball cards"
    - "football cards"
    - "hockey cards"
    - "soccer cards"
    - "nascar cards"
    - "panini"
    - "topps"
    - "bowman"
    - "donruss"
    - "upper deck"
