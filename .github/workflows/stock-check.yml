name: Pokemon MSRP Stock Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "check_stock.py"
      - "enhanced_check.py"
      - "store_report.py"
      - "queue_monitor.py"
      - "run_forever.py"
      - "Dockerfile"
      - "docker-compose.yml"
      - "config.yaml"
      - "requirements.txt"
      - "test_check_stock.py"
      - ".github/workflows/stock-check.yml"
  pull_request:
    branches:
      - main
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: pokemon-msrp-stock-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Compile stock checker
        run: python -m py_compile check_stock.py enhanced_check.py store_report.py queue_monitor.py run_forever.py test_check_stock.py

      - name: Run unit tests
        run: python -m unittest -v

      - name: Validate Docker Compose
        run: docker compose config
        env:
          DISCORD_WEBHOOK_URL: https://discord.invalid/api/webhooks/test/test

  check-stock:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Send live confirmation
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import os
          import requests
          webhook = os.environ.get("DISCORD_WEBHOOK_URL", "").strip()
          if not webhook:
              raise SystemExit("DISCORD_WEBHOOK_URL secret is missing")
          response = requests.post(
              webhook,
              json={
                  "username": "Pokémon MSRP Alerts",
                  "content": "✅ Pokémon bot updated: checking Obsidian Flames, Ascended Heroes, priorities, quality, and direct item pages."
              },
              timeout=25,
          )
          response.raise_for_status()
          PY

      - name: Check Pokémon Center virtual queue
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python queue_monitor.py

      - name: Check prioritized products and send quality report
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SEND_RUN_SUMMARY: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
          PAGE_TIMEOUT_SECONDS: "25"
        run: python enhanced_check.py

      - name: Save alert state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json queue_state.json
          if git diff --cached --quiet; then
            echo "No state change"
          else
            git commit -m "Update stock and queue state [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
