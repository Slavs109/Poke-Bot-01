name: Pokemon eBay Deal Hunter

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ebay_deals.py"
      - "ebay_config.yaml"
      - "requirements.txt"
      - ".github/workflows/stock-check.yml"
  pull_request:
    branches:
      - main
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: pokemon-ebay-deal-hunter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Compile eBay deal finder
        run: python -m py_compile ebay_deals.py

  scan-ebay:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Send live confirmation
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import os, requests
          webhook = os.environ.get("DISCORD_WEBHOOK_URL", "").strip()
          if webhook:
              requests.post(
                  webhook,
                  json={
                      "username": "Pokémon eBay Deal Hunter",
                      "content": "✅ eBay deal hunter updated: scanning new Pokémon listings and alerting only on aggressive discounts versus comparable sold listings."
                  },
                  timeout=25,
              ).raise_for_status()
          PY

      - name: Scan eBay for unusually cheap Pokemon cards
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CONFIG_PATH: ebay_config.yaml
          FORCE_REPORT: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
          PAGE_TIMEOUT_SECONDS: "25"
        run: python ebay_deals.py

      - name: Save eBay alert state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ebay_state.json
          if git diff --cached --quiet; then
            echo "No state change"
          else
            git commit -m "Update eBay deal state [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
