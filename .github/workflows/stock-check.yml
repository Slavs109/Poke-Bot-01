name: Estate Sale Trading Card Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "estate_sales.py"
      - "estate_config.yaml"
      - "requirements.txt"
      - ".github/workflows/stock-check.yml"
  pull_request:
    branches:
      - main
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: estate-sale-trading-card-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Compile estate-sale scanner
        run: python -m py_compile estate_sales.py

  check-estate-sales:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Send live confirmation
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import os
          import requests
          webhook = os.environ.get("DISCORD_WEBHOOK_URL", "").strip()
          if not webhook:
              raise SystemExit("DISCORD_WEBHOOK_URL secret is missing")
          response = requests.post(
              webhook,
              json={
                  "username": "Estate Sale Card Finds",
                  "content": "✅ Bot updated: scanning estate sales within 25 miles for exact card keywords AND visually checking listing photos for non-sports trading cards."
              },
              timeout=25,
          )
          response.raise_for_status()
          PY

      - name: Check nearby estate sales for text and photo card matches
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CONFIG_PATH: estate_config.yaml
          FORCE_REPORT: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
          PAGE_TIMEOUT_SECONDS: "25"
        run: python estate_sales.py

      - name: Save estate-sale alert state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estate_state.json estate_photo_state.json
          if git diff --cached --quiet; then
            echo "No state change"
          else
            git commit -m "Update estate sale alert state [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
