name: Build DealHunter APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'dealhunter/**'
      - '.github/workflows/dealhunter-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p dealhunter assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DealHunter-APK
          path: dealhunter/app/build/outputs/apk/debug/app-debug.apk
