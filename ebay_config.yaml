ebay_deals:
  enabled: true

  # Broad searches for newly listed Buy It Now inventory.
  search_queries:
    - "pokemon card"
    - "pokemon cards"
    - "pokemon psa"
    - "pokemon charizard"
    - "pokemon pikachu card"
    - "pokemon vintage card"
    - "pokemon booster box"
    - "pokemon elite trainer box"

  # Keep the scan focused and cheap enough for frequent GitHub Actions runs.
  active_results_per_query: 30
  max_comp_checks_per_run: 24
  sold_results_to_parse: 30
  request_delay_seconds: 1.0

  # Comparable sold-listing rules.
  comp_query_tokens: 9
  minimum_title_similarity: 0.40
  minimum_sold_comps: 3
  minimum_sold_median: 20.00

  # "Really good deal" means at least 40% below recent sold median AND $15+ savings.
  minimum_discount_fraction: 0.40
  minimum_absolute_savings: 15.00

  # Avoid spending comp requests on extremely expensive listings.
  maximum_listing_total: 500.00
